<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İyi Ki Doğdun Ezel!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1 id="title">Bir Dilek Tut ve Mumu Üfle! 🎂</h1>
    
    <!-- 45 Derece Açıyla Gerçekçi SVG Pasta -->
    <div class="cake-wrapper">
      <svg class="cake-svg" viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
        <!-- Tabak -->
        <ellipse cx="150" cy="210" rx="130" ry="35" fill="#e2e8f0" />
        <ellipse cx="150" cy="206" rx="120" ry="30" fill="#ffffff" />

        <!-- Pasta Alt Gövdesi (Çikolatalı/Kremalı Yan Yüzey) -->
        <path d="M 40 140 A 110 30 0 0 0 260 140 L 260 185 A 110 30 0 0 1 40 185 Z" fill="#5c3d2e" />
        <!-- Ara Krema Katmanı -->
        <path d="M 40 160 A 110 30 0 0 0 260 160 L 260 168 A 110 30 0 0 1 40 168 Z" fill="#ffb4a2" />

        <!-- Pasta Üst Yüzeyi -->
        <ellipse cx="150" cy="140" rx="110" ry="30" fill="#79523c" />
        <ellipse cx="150" cy="138" rx="104" ry="27" fill="#e5989b" /> <!-- Pembe Çilek Kreması -->

        <!-- Krema Akıntıları -->
        <path d="M 46 140 Q 60 155 70 143 Q 85 160 100 142 Q 120 158 135 141 Q 155 162 170 142 Q 190 158 205 142 Q 225 156 238 142 Q 252 150 254 140 A 110 30 0 0 1 46 140 Z" fill="#ffffff" opacity="0.9" />

        <!-- Üstteki Süslemeler / Çilekler -->
        <circle cx="90" cy="130" r="8" fill="#e63946" />
        <circle cx="210" cy="130" r="8" fill="#e63946" />
        <circle cx="150" cy="152" r="8" fill="#e63946" />
        <circle cx="110" cy="145" r="6" fill="#e63946" />
        <circle cx="190" cy="145" r="6" fill="#e63946" />

        <!-- Mum -->
        <rect x="144" y="75" width="12" height="50" rx="3" fill="#3a86ff" />
        <!-- Mum Çizgileri -->
        <path d="M 144 85 L 156 90 M 144 100 L 156 105 M 144 115 L 156 120" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <!-- Fitil -->
        <line x1="150" y1="75" x2="150" y2="67" stroke="#333" stroke-width="2" />
      </svg>

      <!-- Üfleyince Sönecek Olan Alev -->
      <div class="flame" id="flame"></div>
    </div>

    <!-- Etkileşim Butonu -->
    <button id="startBtn">Üflemek İçin Tıkla & İzin Ver 🌬️</button>

    <!-- Doğum Günü Mesajı -->
    <div id="message" class="hidden">
      <h2>🎉 İYİ Kİ DOĞDUN EZEL! 🎉</h2>
      <p>İyiki doğdun kardeşim!</p>
      <p class="sub-text">Artık sen de reşitsin! 😉</p>
    </div>

    <!-- Sürüm Numarası -->
    <div class="version-tag">v1.0.0</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
